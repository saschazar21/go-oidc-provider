name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: "Guard"
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - run: echo "Proceeding with deploy"

  outputs:
    name: "Set outputs"
    needs: [guard]
    uses: ./.github/workflows/outputs.yml

  ci:
    name: "Run unit tests"
    needs: [guard]
    uses: ./.github/workflows/ci.yml

  netlify:
    name: "Deploy to Netlify"
    runs-on: ubuntu-latest
    needs:
      - outputs
      - ci

    environment:
      name: production
      url: ${{ steps.deploy.outputs.deploy_url }}

    outputs:
      deploy_id: ${{ steps.deploy.outputs.deploy_id }}
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: demo/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "demo/.tool-versions"
          cache: "pnpm"
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: demo

      # NOTE: Go is required by the Netlify build process.
      # Remove this step if your build does not depend on Go.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: demo/go.mod
          check-latest: true
          cache-dependency-path: |
            demo/go.sum

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          COMMIT_MSG: ${{ needs.outputs.outputs.message }}
          SHORT_SHA: ${{ needs.outputs.outputs.short_sha }}
        run: |
          set -euo pipefail

          deploy_message="${SHORT_SHA} \u2013 ${COMMIT_MSG}"

          pnpm netlify deploy \
            --build \
            --prod \
            --context=production \
            --message="${deploy_message}" \
            --telemetry-disable \
            --json \
            > netlify.json

          cat netlify.json

          echo "deploy_id=$(jq -re '.deploy_id' netlify.json)" >> $GITHUB_OUTPUT
          echo "deploy_url=$(jq -re '.deploy_url' netlify.json)" >> $GITHUB_OUTPUT
        working-directory: demo

  vercel:
    name: "Deploy to Vercel"
    runs-on: ubuntu-latest
    needs:
      - outputs
      - ci

    environment:
      name: vercel-production
      url: ${{ steps.deploy.outputs.deploy_url }}

    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}

    defaults:
      run:
        working-directory: demo

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: demo/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: demo/.tool-versions
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: demo/go.mod
          cache-dependency-path: |
            go.sum
            demo/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID variable}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID variable}"
          pnpm exec vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Compile Vercel functions
        run: make vercel

      - name: Validate prebuilt output
        run: make vercel-check

      - name: Deploy prebuilt demo to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_url=$(pnpm exec vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "deploy_url=${deploy_url}" >> "$GITHUB_OUTPUT"
